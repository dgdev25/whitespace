schemaVersion: 1
title: Whitespace
summary: A read-only, invite-gated technical showcase of reviewable AI-product hypotheses built from permanently synthetic evidence.
description: >
  Whitespace demonstrates an evidence-to-product-review workflow using two
  permanently synthetic source records and three prebuilt ideas. The hosted
  environment is deliberately read only: live ingestion, model analysis, and
  generation routes are disabled before any external request can occur.
tags: [ai, synthetic-data, review-workflow, fastapi, react]
technicalMaps:
  workflow:
    url: https://lyledg.com/product-maps/whitespace-workflow-map.png
    alt: "Technical workflow map: idempotent synthetic seed, evidence review, static plan output, deterministic export, and blocked live pipeline requests."
  architecture:
    url: https://lyledg.com/product-maps/whitespace-architecture-map.png
    alt: "Technical architecture map: invite-gated React UI, FastAPI, SQLite synthetic records, and disabled ingestion and model-generation boundaries."
visibility: public-card
port: 8000
healthPath: /api/system/health
deploy:
  mode: dockerfile
  dockerfile: Dockerfile
# Single-container demo: the FastAPI backend serves the frontend's built
# static assets itself (see backend/app/main.py's STATIC_DIR mount) rather
# than running as two separate services. Uses the backend's default SQLite
# database — no external Postgres/ruvector dependency, so vector-search
# features that need the ruvector Postgres extension run in a degraded/
# no-op mode in this demo. The repo's docker-compose.dev-minimal.yml (with
# Postgres + a worker profile) remains the full local-dev setup; this
# Dockerfile is only for the myportfolio showcase container.
resources: small
lifecycle: { sleepable: true, sleepAfterMinutes: 30 }

category: AI research tool
overview: >
  The hosted Whitespace showcase presents a deterministic evidence-review
  workflow. It starts with two labelled synthetic source records and three
  scored ideas, then lets an invited reviewer inspect a complete static product
  sketch, PRD, and technical plan. The browser never receives a provider key,
  and the server rejects live ingestion, model analysis, and plan generation.
techStack:
  - { name: FastAPI, label: "read-only API and showcase boundary" }
  - { name: React, label: "frontend UI" }
  - { name: TypeScript, label: "frontend types" }
  - { name: SQLite, label: "synthetic demo data store" }
hero:
  appName: Whitespace
  nav: [Feed, Saved, History, Projects, Settings]
  activeNav: Feed
  screenTitle: Synthetic Idea Feed
  stats:
    - { label: "Ideas", value: "3" }
    - { label: "Synthetic sources", value: "2" }
    - { label: "Live pipelines", value: "0" }
  lists:
    - title: "Recent ideas"
      items:
        - { label: "Evidence Ledger for AI decisions", sub: "synthetic" }
        - { label: "Policy Diff for changing controls", sub: "synthetic" }
  chart: donut
howItWorks:
  kicker: "WHITESPACE · IDEA PIPELINE"
  heading: A fixed synthetic dataset demonstrates reviewable product hypotheses.
  subhead: Static evidence in, inspectable plans out — without an external source or model call.
  steps:
    - { label: "01 · SEED", title: "Load synthetic records", lines: ["Two source records and three ideas", "Idempotent startup repair"], tag: "SQLite" }
    - { label: "02 · REVIEW", title: "Inspect evidence and scores", lines: ["Synthetic source references", "Novelty and feasibility context"], tag: "Read-only" }
    - { label: "03 · PLAN", title: "Open static product output", lines: ["Prebuilt sketch, PRD, and technical plan"], tag: "Static" }
    - { label: "04 · ENFORCE", title: "Block live operations", lines: ["Ingestion and model routes return 403"], tag: "Guard" }
  guarantees: ["Every hosted record is explicitly synthetic", "No live ingestion, model call, or browser credential"]
architecture:
  kicker: "WHITESPACE · ARCHITECTURE"
  heading: A FastAPI backend serves a React frontend from one read-only container.
  subhead: SQLite holds only fixed synthetic records; live research and model boundaries are disabled.
  columns:
    - label: "01 · CLIENT"
      nodes:
        - { tag: "UI", title: "React frontend", lines: ["Feed, evidence review, static plans"] }
    - label: "02 · API"
      nodes:
        - { tag: "API", title: "FastAPI backend", lines: ["Read endpoints, static export, health"] }
        - { tag: "GUARD", title: "Showcase safety boundary", lines: ["Live ingestion and model actions return 403"] }
    - label: "03 · DATA"
      nodes:
        - { tag: "DB", title: "SQLite", lines: ["Synthetic sources, ideas, static plans"] }
  legend:
    - { style: solid, label: "application data" }
    - { style: dashed, label: "disabled live-operation boundary" }
